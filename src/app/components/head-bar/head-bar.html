<header class="bar">
  <div class="brand">
    <h1 class="brand-name">Ayoub's Showroom</h1>
    <p class="tagline">New cars in Tunis. Every one ready for a test drive.</p>
  </div>

  <button
    type="button"
    class="garage"
    [class.active]="garageActive"
    [attr.aria-pressed]="garageActive"
    (click)="garageToggle.emit()"
  >
    <fa-icon [icon]="faHeart" />
    <span class="garage-label">My garage</span>
    <span class="badge">{{ favoritesCount }}<span class="sr-only"> saved cars</span></span>
  </button>
</header>
